<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIZZAY Snack Distributor</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header class="header"><h1>AIZZAY</h1><p>SNACK DISTRIBUTOR</p></header>
<main>
<section class="dashboard">
<div class="card"><span>📦</span><h3>Produk Jadi</h3><p id="stokJadi">0 bungkus</p></div>
<div class="card"><span>📦</span><h3>Stok Bal</h3><p id="stokBal">0 bal</p></div>
<div class="card"><span>🏭</span><h3>Packing</h3><p id="packing">0 proses</p></div>
<div class="card"><span>🏪</span><h3>Di Toko</h3><p id="diToko">0 bungkus</p></div>
<div class="card"><span>💰</span><h3>Kas</h3><p id="kas">Rp 0</p></div>
</section>
<section class="menu">
<button onclick="bukaProduk()">📦<br>Master Produk</button>
<button>🛒<br>Belanja</button>
<button>🏭<br>Packing</button>
<button>🏪<br>Toko</button>
<button>💰<br>Kas</button>
<button>📊<br>Laporan</button>
<button>⚙️<br>Pengaturan</button>
</section>
<div id="konten"></div>
</main>
<footer><p>AIZZAY Snack Distributor © 2026</p></footer>
<script src="app.js"></script>
<script>
async function bukaProduk(){
 const res=await fetch("modules/produk/produk.html");
 const data=await res.text();
 document.getElementById("konten").innerHTML=data;
 const lama=document.getElementById("produk-module");
 if(lama) lama.remove();
 const script=document.createElement("script");
 script.id="produk-module";
 script.type="module";
 script.src="modules/produk/produk.js?v=2";
 alert("Akan memuat produk.js");
document.body.appendChild(script);
}
</script>
</body>
</html>
