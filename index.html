<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIZZAY Snack Distributor</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#c96b24">
</head>
<body>
<header class="header"><h1>AIZZAY</h1><p>SNACK DISTRIBUTOR</p></header>
<main>
<section class="dashboard">
<div class="card"><span>📦</span><h3>Produk Jadi</h3><p id="stokJadi">0 bungkus</p></div>
<div class="card"><span>📦</span><h3>Stok Bal</h3><p id="stokBal">0 bal</p></div>
<div class="card"><span>🏭</span><h3>Packing</h3><p id="packing">0 proses</p></div>
<div class="card"><span>🏪</span><h3>Di Toko</h3><p id="diToko">0 bungkus</p></div>
<div class="card"><span>💰</span><h3>Kas</h3><p id="kas">Rp 0</p></div>
</section>
<section class="menu">
<button onclick="bukaProduk()">📦<br>Master Produk</button>
<button onclick="bukaBelanja()">🛒<br>Belanja</button>
<button onclick="bukaPacking()">🏭<br>Packing</button>
<button onclick="bukaToko()">🏪<br>Toko</button>
<button onclick="bukaKas()">💰<br>Kas</button>
<button onclick="bukaLaporan()">📊<br>Laporan</button>
<button onclick="bukaPengaturan()">⚙️<br>Pengaturan</button>
</section>
<div id="konten"></div>
</main>
<footer><p>AIZZAY Snack Distributor © 2026</p></footer>
<script src="app.js"></script>
<div id="debugBox" style="position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;background:#000;color:#0f0;font-size:11px;padding:8px;z-index:9999;display:none;"></div>
<script>
function tampilError(pesan){
    let box = document.getElementById("debugBox");
    box.style.display = "block";
    box.innerHTML += "⚠️ " + pesan + "<br><hr>";
}
window.onerror = function(pesan, sumber, baris){
    tampilError(pesan + " (baris " + baris + ")");
};
window.addEventListener("unhandledrejection", function(e){
    tampilError("Promise error: " + e.reason);
});
</script>
<script>
async function bukaProduk(){
 const res=await fetch("modules/produk/produk.html");
 const data=await res.text();
 document.getElementById("konten").innerHTML=data;
 await import("./modules/produk/produk.js?v=" + Date.now());
}

async function bukaBelanja(){
 const res=await fetch("modules/belanja/belanja.html");
 const data=await res.text();
 document.getElementById("konten").innerHTML=data;
 await import("./modules/belanja/belanja.js?v=" + Date.now());
}

 document.getElementById("konten").innerHTML=data;
 await import("./modules/toko/toko.js?v=" + Date.now());
}

async function bukaLaporan(){

 document.getElementById("konten").innerHTML=data;

}

 document.getElementById("konten").innerHTML=data;

async function bukaKas(){

 document.getElementById("konten").innerHTML=data;

async function bukaPengaturan(){
 const res=await fetch("modules/pengaturan/pengaturan.html");

 document.getElementById("konten").innerHTML=data;
 await import("./modules/pengaturan/pengaturan.js?v=" + Date.now());
}
</script>
</body>
</html>
