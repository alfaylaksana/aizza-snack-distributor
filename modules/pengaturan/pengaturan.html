<style>
.pengaturan-page .card {
    margin-bottom: 12px;
}
.pengaturan-page .card h3 {
    margin-top: 0;
}
.pengaturan-page .card p {
    font-size: 13px;
    color: #555;
}
.pengaturan-page .peringatan {
    color: #b03a2e;
    font-weight: bold;
}
.pengaturan-page input[type="file"] {
    font-size: 12px;
    width: 100%;
}
</style>

<section class="pengaturan-page">

<h2>⚙️ Pengaturan</h2>

<div class="card">
<h3>💾 Backup Data (Export)</h3>
<p>Unduh semua data Produk, Belanja, dan Toko dalam satu file JSON. Simpan file ini di tempat aman (Google Drive, dsb) sebagai cadangan.</p>
<button onclick="exportData()">⬇️ Export Data (JSON)</button>
</div>

<div class="card">
<h3>♻️ Pulihkan / Gabungkan Data (Import)</h3>
<p>Pilih mode dulu, baru pilih file backup JSON:</p>

<label style="display:block;margin-bottom:6px;">
<input type="radio" name="modeImport" value="gabung" checked>
<b>Gabungkan</b> — data yang sudah ada di HP tetap dipakai, data dari file yang belum ada ditambahkan
</label>

<label style="display:block;margin-bottom:10px;">
<input type="radio" name="modeImport" value="timpa">
<b>Timpa Semua</b> — <span class="peringatan">ganti total, data lama di HP hilang</span>, diganti persis isi file
</label>

<input type="file" id="fileImportJSON" accept="application/json" onchange="importData(event)">
</div>

</section>
