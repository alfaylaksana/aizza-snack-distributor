<style>
.toko-page .card,
.toko-page .card * {
    font-size: 11px;
}

.toko-page .card b {
    font-size: 12px;
    font-weight: bold;
}

.toko-page .card .status-berjalan {
    color: #c96b24;
    font-weight: normal;
}
.toko-page .card .status-selesai {
    color: green;
    font-weight: normal;
}

.toko-page .card .bayar-lunas {
    color: green;
    font-weight: normal;
}
.toko-page .card .bayar-hutang {
    color: red;
    font-weight: normal;
}
.toko-page .card .bayar-cicilan {
    color: #c96b24;
    font-weight: normal;
}

.toko-page .card .btn-icon {
    font-size: 11px;
    padding: 2px 5px;
    line-height: 1;
}

.toko-page .card .sinkron-badge {
    font-size: 11px;
    line-height: 1;
}

.toko-page .baris-item {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    align-items: center;
    font-size: 12px;
}
.toko-page .baris-item input {
    font-size: 12px;
    flex: 1;
    min-width: 0;
}
.toko-page .baris-item button {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 2px 6px;
}

.toko-page .baris-settle {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    align-items: center;
    font-size: 12px;
}
.toko-page .baris-settle input {
    font-size: 12px;
    flex: 1;
    min-width: 0;
}
.toko-page .baris-settle span {
    font-size: 11px;
    flex: 1;
}

.toko-page .item-produk {
    font-size: 11px;
    border-top: 1px dashed #ccc;
    padding-top: 3px;
    margin-top: 3px;
}

#formSettle {
    display: none;
    background: #f5f5f5;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
}
</style>

<section class="toko-page">

<h2>🏪 Toko (Titip Jual)</h2>

<div class="form-produk">

<h3>Kirim Titipan Baru</h3>

<input id="tanggalKirim" type="date">

<input id="tokoInput" list="daftarToko" placeholder="Nama Toko">
<datalist id="daftarToko"></datalist>

<datalist id="daftarProdukToko"></datalist>

<h3>Produk yang dititip:</h3>

<div id="daftarItemKirim"></div>

<button onclick="tambahBarisKirim()">
➕ Tambah Produk
</button>

<textarea id="catatanKirim" placeholder="Catatan"></textarea>

<button onclick="simpanKirim()">
💾 Simpan Kirim Titipan
</button>

</div>


<div id="formSettle">

<h3>Settle Titipan</h3>
<p id="infoSettle"></p>

<div id="daftarItemSettle"></div>

<select id="statusBayarSettle" onchange="toggleJumlahDibayarSettle()">
<option value="lunas">Lunas</option>
<option value="hutang">Hutang</option>
<option value="cicilan">Cicilan</option>
</select>

<input id="jumlahDibayarSettle" type="number" placeholder="Jumlah Dibayar" style="display:none" oninput="simpanDraftSettle()">

<p id="totalSettlePreview"></p>

<button onclick="simpanSettle()">
✅ Simpan Settle
</button>

<button onclick="batalSettle()">
✖️ Batal
</button>

</div>


<hr>


<h3 id="judulRiwayatToko">Riwayat Titipan</h3>

<input
id="cariToko"
placeholder="🔍 Cari toko / produk..."
onkeyup="cariToko()">


<div id="daftarTitipan"></div>


</section>
