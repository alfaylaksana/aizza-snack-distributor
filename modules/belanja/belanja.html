<style>
.belanja-page .card,
.belanja-page .card * {
    font-size: 11px;
}

.belanja-page .card b {
    font-size: 12px;
    font-weight: bold;
}

.belanja-page .card .bayar-lunas {
    color: green;
    font-weight: normal;
}
.belanja-page .card .bayar-hutang {
    color: red;
    font-weight: normal;
}
.belanja-page .card .bayar-cicilan {
    color: #c96b24;
    font-weight: normal;
}

.belanja-page .card .btn-icon {
    font-size: 11px;
    padding: 2px 5px;
    line-height: 1;
}

.belanja-page .card .sinkron-badge {
    font-size: 11px;
    line-height: 1;
}

.belanja-page .baris-item {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    align-items: center;
    font-size: 12px;
}
.belanja-page .baris-item input {
    font-size: 12px;
    flex: 1;
    min-width: 0;
}
.belanja-page .baris-item button {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 2px 6px;
}

.belanja-page .item-produk {
    font-size: 11px;
    border-top: 1px dashed #ccc;
    padding-top: 3px;
    margin-top: 3px;
}

#rekapBelanja {
    display: none;
    font-size: 12px;
    background: #f5f5f5;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
}
#rekapBelanja table {
    width: 100%;
    font-size: 12px;
}
</style>

<section class="belanja-page">

<h2>🛒 Belanja</h2>

<button onclick="toggleRekap()">📊 Rekap Bulan Ini</button>

<div id="rekapBelanja"></div>

<div class="form-produk">

<input id="tanggalBelanja" type="date">

<input id="supplierBelanja" list="daftarSupplier" placeholder="Supplier">
<datalist id="daftarSupplier">
<option value="Grosir Lokal">
<option value="Shopee">
</datalist>

<select id="statusBayar" onchange="toggleJumlahDibayar()">
<option value="lunas">Lunas</option>
<option value="hutang">Hutang</option>
<option value="cicilan">Cicilan</option>
</select>

<input id="jumlahDibayar" type="number" placeholder="Jumlah Dibayar" style="display:none">

<datalist id="daftarProdukBelanja"></datalist>

<h3>Produk yang dibeli:</h3>

<div id="daftarItemInput"></div>

<button onclick="tambahBarisItem()">
➕ Tambah Produk
</button>

<textarea id="catatanBelanja" placeholder="Catatan"></textarea>

<button onclick="simpanKulakan()">
💾 Simpan Kulakan
</button>

</div>


<hr>


<h3>Riwayat Kulakan</h3>

<input
id="cariBelanja"
placeholder="🔍 Cari supplier / produk..."
onkeyup="cariBelanja()">


<div id="daftarBelanja"></div>


</section>
