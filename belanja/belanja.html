<style>
/* Paksa semua teks di kartu belanja jadi 11px, terlepas dari aturan luar
   (style.css global punya .card span {font-size:30px} untuk dashboard) */
.belanja-page .card,
.belanja-page .card * {
    font-size: 11px;
}

.belanja-page .card b {
    font-size: 12px;
    font-weight: bold;
}

/* Warna status bayar */
.belanja-page .card .bayar-lunas {
    color: green;
    font-weight: normal;
}
.belanja-page .card .bayar-hutang {
    color: red;
    font-weight: normal;
}
.belanja-page .card .bayar-cicilan {
    color: #c96b24;
    font-weight: normal;
}

/* Tombol ikon kecil, tanpa teks, dipaksa seragam */
.belanja-page .card .btn-icon {
    font-size: 11px;
    padding: 2px 5px;
    line-height: 1;
}

/* Badge sinkron kecil, tanpa teks, dipaksa seragam */
.belanja-page .card .sinkron-badge {
    font-size: 11px;
    line-height: 1;
}
</style>

<section class="belanja-page">

<h2>🛒 Belanja</h2>

<div class="form-produk">

<input id="tanggalBelanja" type="date">

<input id="supplierBelanja" list="daftarSupplier" placeholder="Supplier">
<datalist id="daftarSupplier">
<option value="Grosir Lokal">
<option value="Shopee">
</datalist>

<input id="kodeBelanja" list="daftarProdukBelanja" placeholder="Kode Produk" onchange="isiNamaOtomatis()">
<datalist id="daftarProdukBelanja"></datalist>

<input id="namaBelanja" placeholder="Nama Produk">

<input id="jumlahBal" type="number" step="0.1" placeholder="Jumlah Bal">

<input id="hargaPerBal" type="number" placeholder="Harga per Bal">

<select id="statusBayar" onchange="toggleJumlahDibayar()">
<option value="lunas">Lunas</option>
<option value="hutang">Hutang</option>
<option value="cicilan">Cicilan</option>
</select>

<input id="jumlahDibayar" type="number" placeholder="Jumlah Dibayar" style="display:none">

<textarea id="catatanBelanja" placeholder="Catatan"></textarea>

<button onclick="simpanBelanja()">
💾 Simpan
</button>

</div>


<hr>


<h3>Riwayat Belanja</h3>

<input
id="cariBelanja"
placeholder="🔍 Cari..."
onkeyup="cariBelanja()">


<div id="daftarBelanja"></div>


</section>
